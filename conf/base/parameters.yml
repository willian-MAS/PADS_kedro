columns:
  target: Outcome
  numerical:
    - Pregnancies
    - Glucose
    - BloodPressure
    - SkinThickness
    - Insulin
    - BMI
    - DiabetesPedigreeFunction
    - Age
  categorical: []
  # zeros nessas colunas sao valores faltantes (ninguem tem glicose ou IMC zero)
  zero_as_missing:
    - Glucose
    - BloodPressure
    - SkinThickness
    - Insulin
    - BMI
  engineered_numerical:
    - NEW_GLUCOSE_INSULIN
    - NEW_GLUCOSE_PREGNANCIES
  engineered_categorical:
    - NEW_AGE_CAT
    - NEW_BMI_CAT
    - NEW_GLUCOSE_CAT
    - NEW_GLUCOSE_LEVEL
    - NEW_AGE_BMI_CAT
    - NEW_AGE_GLUCOSE_CAT
    - NEW_INSULIN_SCORE

# features derivadas (secao 17 do notebook)
feature_engineering:
  binned:
    NEW_AGE_CAT:
      source: Age
      bins: [0, 50, 200]
      labels: [mature, senior]
      right: false
    NEW_BMI_CAT:
      source: BMI
      bins: [0, 18.5, 24.9, 29.9, 200]
      labels: [Underweight, Healthy, Overweight, Obese]
    NEW_GLUCOSE_CAT:
      source: Glucose
      bins: [0, 140, 200, 500]
      labels: [Normal, Prediabetes, Diabetes]
    NEW_GLUCOSE_LEVEL:
      source: Glucose
      bins: [0, 70, 100, 126, 500]
      labels: [low, normal, hidden, high]
      right: false
  ranged:
    NEW_INSULIN_SCORE:
      source: Insulin
      low: 16
      high: 166
      inside: Normal
      outside: Abnormal
  combined:
    NEW_AGE_BMI_CAT: [NEW_BMI_CAT, NEW_AGE_CAT]
    NEW_AGE_GLUCOSE_CAT: [NEW_GLUCOSE_LEVEL, NEW_AGE_CAT]
  products:
    NEW_GLUCOSE_INSULIN: [Glucose, Insulin]
    NEW_GLUCOSE_PREGNANCIES: [Glucose, Pregnancies]
