# mesmas funcoes da data_engineering, agora ajustadas em todos os splits
refit_imputers:
  columns: [numerical]
  strategy: median
  split_to_fit: [train, test, validate]

refit_outliers:
  columns: [numerical]
  q_low: 0.05
  q_high: 0.95
  iqr_factor: 1.5
  split_to_fit: [train, test, validate]

refit_encoders:
  columns: [engineered_categorical]
  split_to_fit: [train, test, validate]

refit_scalers:
  columns: [numerical, engineered_numerical]
  class_path: sklearn.preprocessing.RobustScaler
  split_to_fit: [train, test, validate]

refit_model:
  feature_groups:
    - numerical
    - engineered_numerical
    - engineered_categorical
  train_splits: [train, test, validate]
