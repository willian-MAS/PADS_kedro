split:
  train: 0.7
  test: 0.15
  validate: 0.15
  random_state: 42

# todos os ajustes usam so o treino, para nao vazar informacao do teste
modelling_imputers:
  columns: [numerical]
  strategy: median
  split_to_fit: [train]

modelling_outliers:
  columns: [numerical]
  q_low: 0.05
  q_high: 0.95
  iqr_factor: 1.5
  split_to_fit: [train]

modelling_encoders:
  columns: [engineered_categorical]
  split_to_fit: [train]

modelling_scalers:
  columns: [numerical, engineered_numerical]
  class_path: sklearn.preprocessing.RobustScaler
  split_to_fit: [train]
